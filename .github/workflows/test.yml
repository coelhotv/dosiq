name: Test Suite

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '.agent/**'
      - '*.md'
      - 'scripts/**'
      - 'scratches/**'
  pull_request:
    # Inclui feat/** para suportar estratégia de "branch de branch":
    # sprint branches (feat/<area>-<topico>) targetam mãe (feat/<area>)
    # antes de mergear na main. Sem isso, PRs sprint→mãe não rodam CI.
    branches: [main, develop, "feat/**"]
    paths-ignore:
      - 'docs/**'
      - '.agent/**'
      - '*.md'
      - 'scripts/**'
      - 'scratches/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ==========================================
  # JOB 1: LINT (Mais rápido - roda sempre)
  # ==========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get changed files
        id: changed-files
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMRT origin/${{ github.event.pull_request.base.ref || 'main' }}...HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx' | tr '\n' ' ')
          echo "all_changed_files=$FILES" >> $GITHUB_OUTPUT
          if [ -n "$FILES" ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run ESLint (Incremental on PR)
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        run: npx eslint ${{ steps.changed-files.outputs.all_changed_files }}

      # Gates acoplados ao `npm run lint` (hoje: unit-label-gate) precisam rodar
      # em PR — antes eram exclusivos do push na main, ou seja, só acusavam com o
      # problema JÁ mergeado. Foi assim que a main ficou vermelha de 2026-07-29
      # (#781) a 2026-08-02 sem ninguém ver. São gates de repo inteiro, não de
      # diff: rodar completo é barato e é o único jeito de barrar antes do merge.
      - name: Run repo gates (PR)
        if: github.event_name == 'pull_request'
        run: npm run lint:unit-label

      - name: Run ESLint (Full on Main/Develop)
        if: github.event_name == 'push'
        run: npm run lint

  # ==========================================
  # JOB 2: SMOKE TESTS (Build + Testes rápidos)
  # ==========================================
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Smoke Tests
        run: npm run test:smoke

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Run Serverless Smoke Test (Cold Start)
        run: npm run test:smoke-server

  # ==========================================
  # JOB 3: UNITÁRIOS CRÍTICOS
  # ==========================================
  critical:
    name: Unitários Críticos
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Critical Tests
        run: npm run test:critical

  # ==========================================
  # JOB 5: BUILD (Verificar se build passa)
  # ==========================================
  build:
    name: Build
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-dist
          path: dist/
          retention-days: 1
